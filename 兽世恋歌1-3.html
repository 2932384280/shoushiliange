    const firstMeetStories = {
        cangye: `<h2>🐺 初遇苍夜</h2><p>月崖之上，孤狼独啸。你循声登上崖顶，月光洒在银白色的巨狼身上，他正仰头望着满月。听到脚步声，他缓缓转过身，冰蓝的眼眸中闪过一丝警惕与好奇。他变回人形，银发在夜风中飘扬，低沉的声音响起：“你是那个来自异世的人类？”他的狼尾微微摆动，似乎在审视着你这陌生的闯入者。</p>`,
        lieyang: `<h2>🐯 初遇烈阳</h2><p>训练场上，一只橙黑条纹的猛虎正在独自练习扑击。他注意到你，立刻变回人形，抹了把汗，露出灿烂的笑容：“嘿！你就是部落新来的那个女孩？要不要一起练练？”说着挥了挥拳头，虎尾在身后兴奋地甩动。阳光洒在他身上，连带着他的笑容都闪闪发光。</p>`,
        xuanyu: `<h2>🦊 初遇玄羽</h2><p>密林深处，药香浮动。一只九尾黑狐正蹲在古树下，优雅地舔着前爪。他抬起头，狭长的狐狸眼眯了起来，九条尾巴缓缓展开。“哎呀，迷路的小家伙。”他变回人形，紫袍轻扬，用折扇掩住半张脸，“需要我送你出去吗？当然，是要收报酬的。”他的眼中闪着狡黠的光。</p>`,
        yanyue: `<h2>🐻 初遇岩岳</h2><p>铁匠铺里炉火熊熊，一个魁梧的身影正在捶打烧红的铁块。他察觉到动静，停下手中的活，转过身来。一头棕熊的轮廓在火光中显得格外高大。他变回人形，用围裙擦着手，憨厚地笑了笑：“小心，这里烫。”他的声音低沉温和，如同冬日里的炉火。</p>`,
        liuyun: `<h2>🦅 初遇流云</h2><p>哨塔之巅，一只苍鹰正迎着风站立。他转头看向你，金色的瞳孔锐利如箭。他展开双翼，轻盈地落在你面前，变回人形，语气冷淡：“这里不是你该来的地方。”但他的翅膀却不动声色地为你挡住了高空的强风，耳尖微微发红。</p>`,

    const soulOathStories = {
        cangye: `<h2>🐺 苍夜 · 灵魂之誓</h2><p>满月之夜，苍夜带你来到月崖最高处，那里矗立着一块古老的狼族图腾。他化作银白巨狼，仰天长啸，月光如银河倾泻，将你们笼罩其中。</p><p>他变回人形，单膝跪地，从怀中取出一柄骨刀，毫不犹豫地在掌心划出一道血痕。"以我苍夜之名，以霜月狼族先祖之魂起誓。"他的声音在崖顶回荡，"今生今世，我愿用生命守护你，用灵魂铭记你。若违此誓，愿兽神收回我的力量，让我永堕黑暗，不得轮回。"</p><p>"狼族一生只认一个伴侣，灵魂一旦相连，便永不分离。你愿意接受我的灵魂契约吗？"</p>`,
        lieyang: `<h2>🐯 烈阳 · 灵魂之誓</h2><p>清晨的第一缕阳光洒在训练场上，烈阳已经站在场地中央。他换上了最隆重的兽皮战甲，虎尾笔直地竖在身后。他看到你来，深吸一口气，单膝跪下。</p><p>"我烈阳，赤金虎族最强战士，今天在太阳神和兽神的见证下，向你起誓！"他用力捶打自己的胸口，发出沉闷的回响。"我这辈子打过的架数不清，但从来没怕过什么。可是现在，我害怕失去你。"</p><p>"你愿意，接受我的灵魂契约吗？愿意让我成为你的伴侣，一辈子对你好吗？"</p>`,
        xuanyu: `<h2>🦊 玄羽 · 灵魂之誓</h2><p>幻香居内，九盏魂灯依次亮起，幽蓝色的火焰在虚空中摇曳。玄羽立于灯阵中央，九条尾巴缓缓展开，每一条尾尖都燃起一簇灵魂之火。</p><p>"以我玄羽之名，以九尾玄狐千年修为为凭，在此立下灵魂誓约。"他的声音空灵而庄重。"两百年来，我独自行走于世间，以为永生便是自由。直到遇见你，我才明白，漫长的生命若无人相伴，只是无尽的囚笼。"</p><p>"你愿意接受一个活了太久、终于找到归宿的狐狸吗？"</p>`,
        yanyue: `<h2>🐻 岩岳 · 灵魂之誓</h2><p>铁匠铺的炉火熊熊燃烧，岩岳将一块古朴的熊族护符放入熔炉中，然后割破手指，滴入自己的鲜血。护符在火焰中发出柔和的光芒，逐渐变成一枚小巧的戒指。</p><p>"我嘴笨，说不出什么好听的话。"他低着头，耳根烧得通红，"但兽神看得见我的心。我岩岳，大地熊族后裔，以这枚用我鲜血锻造的戒指起誓——这辈子，我只爱你一个人。"</p><p>"你愿意，接受我的灵魂契约吗？愿意和一个笨拙的铁匠共度余生吗？"</p>`,
        liuyun: `<h2>🦅 流云 · 灵魂之誓</h2><p>云巢之巅，流云展开双翼，逆风而立。他从翼上取下最长的一根飞羽，又从颈间解下一枚青色的风之宝石——那是鹰族代代相传的信物。</p><p>"苍羽鹰族流云，以风之名起誓。"他的声音被高空的狂风撕扯，却字字清晰。"我不会说漂亮话，但我知道，从今往后，这片天空若没有你，再高再远也没有意义。"</p><p>"所以……你愿意吗？愿意和我这个嘴硬的家伙，一起飞一辈子吗？"</p>`,
        moli: `<h2>🐍 墨漓 · 灵魂之誓</h2><p>竹楼深处，墨漓将一枚碧绿的鳞片放在你掌心，鳞片在月光下流转着微光。他轻抬你的手腕，将自己的血滴在鳞片上，瞬间融入你的脉搏。</p><p>"以我墨漓之名，以千年碧鳞蛇族的先祖为证。"他的蛇瞳闪烁着妖冶的光芒，声音却异常温柔。"我见惯生死，本无意红尘。但你这条小命，我捡回来了，便不许你再轻易丢弃。"</p><p>"你愿意，让我用余生守护你，成为你唯一的药引吗？"</p>`

    const confessionStories = {
        cangye: `<h2>🐺 苍夜的告白</h2><p>月崖之上，苍狼独立。银色的月光洒在他银白色的毛发上，仿佛为他披上了一层霜华。他听到你的脚步声，耳朵轻轻转动，却没有回头。</p><p>"你来了。"他的声音低沉而平稳，但狼尾却不自觉地轻轻摆动——那是狼族表达喜悦的方式。他缓缓转过身，那双冰蓝色的眼睛注视着你，比月光更清冷，却也藏着只有你能读懂的温暖。"我一直在这里等你。"</p><p>他变回人形，单膝跪地，从怀中取出一枚用月光石打磨的吊坠。"这是我用狼牙和月光石亲手制作的。狼族一生只认一个伴侣，而我，在遇见你的那一刻，就已经做出了选择。"</p><p>"你愿意，成为我的伴侣吗？愿意让我用余生守护你，让狼群尊你为王后？"</p>`,
        lieyang: `<h2>🐯 烈阳的告白</h2><p>训练场的沙地上，烈阳已经来回踱步了不知多少圈。地面上满是深深浅浅的虎爪印，那是他紧张时留下的痕迹。看到你走来，他的耳朵猛地竖起，虎尾僵直地定在半空。</p><p>"你、你来了！"他的声音比平时高了几度，"我、我准备了东西给你！"他从背后拿出一个用兽皮包裹的小包，手忙脚乱地打开——里面是一枚打磨得光滑的虎牙吊坠，还有一堆压得有些变形的野花。</p><p>"我喜欢你！从第一天在训练场看到你，我就喜欢你了！你愿意和我在一起吗？我会用一辈子对你好！"他的虎尾终于不再僵硬，而是充满期待地轻轻摇晃起来。</p>`,
        xuanyu: `<h2>🦊 玄羽的告白</h2><p>幻香居内，紫色的薄纱随风轻舞，空气中弥漫着淡淡的药香与花香。玄羽倚在竹帘旁，手中把玩着一朵散发幽光的奇花，九条尾巴在身后优雅地摆动。</p><p>"你知道吗？"他微微一笑，眼角的狐狸纹路微微上扬，"这朵花的名字叫'永伴'，传说只要两人共同浇灌，它就永远不会凋谢。"</p><p>"我活了两百多年，见过沧海桑田，见过无数生灵来了又走。漫长的岁月里，我习惯了独自一人。但遇见你之后，我开始害怕孤独。你愿意，成为我漫长生命里唯一的色彩吗？"</p>`,
        yanyue: `<h2>🐻 岩岳的告白</h2><p>铁匠铺的炉火映红了石壁，岩岳坐在工作台前，粗糙的大手里捧着一枚小巧的戒指。那是他用最上等的星铁，花了无数个夜晚精心打磨而成的。</p><p>看到你进来，他慌忙站起来，差点碰倒了桌上的工具。他不好意思地用围裙擦了擦手，把戒指递到你面前。"给你。"他的声音低沉而简短，耳朵却红得发烫。</p><p>"我不会说好听的话。"他低下头，粗大的手指绞在一起，"但我会打铁，会盖房子，会采蜂蜜。以后你的锅破了，我给你补；屋子漏了，我给你修；冬天冷，我变成熊给你暖脚。"</p><p>"你愿意……和我一起过吗？"</p>`,
        liuyun: `<h2>🦅 流云的告白</h2><p>哨塔顶端的风格外强劲，流云站在巢边，苍鹰的羽翼在夕阳下闪着金光。他没有回头，只是望着远方，仿佛在研究天边的云层。</p><p>"你来了。"他的语气依旧冷淡，但翅膀尖却悄悄向你靠近了几寸。"我观察你很久了。"他突然开口，声音被风吹得有些飘忽。</p><p>"后来我发现，我开始习惯了。习惯每天在高处寻找你的身影，习惯看你从广场走过，习惯你在哨塔下仰望天空的样子。"他从羽翼间取出一根最长的飞羽，递到你面前。那是鹰族最珍贵的礼物——赠羽定情。</p><p>"我不懂什么甜言蜜语。但如果你想看更远的风景，我的背永远给你。如果你愿意的话。"</p>`,
        moli: `<h2>🐍 墨漓的告白</h2><p>竹楼内药香袅袅，墨漓斜倚在竹榻上，手中捻着一株紫草。他抬眸看你，蛇瞳中流转着深不见底的温柔。</p><p>"你知道我为什么总是救你吗？"他轻笑，声音如清泉过石，"因为从第一次见到你，我就舍不得让你再受伤了。"</p><p>他将那株紫草递到你面前，"这是碧鳞蛇族的定情草，一生只赠一人。你愿意，收下它吗？"</p>`

    const unrequitedStories = {
        cangye: `<h2>🐺 苍夜·爱而不得</h2><p>苍夜望着你离去的背影，那双冰蓝色的眼眸终于黯淡了下去。他缓缓坐回石床上，手指轻轻抚过刻满你名字的石壁，每一笔都像是在心上划下新的伤痕。</p><p>"或许……这才是最好的结局。"他低声喃喃，声音沙哑得不像那个威严的狼王。"愿你幸福。"他对着空无一人的洞穴轻声说道。</p>`,
        lieyang: `<h2>🐯 烈阳·爱而不得</h2><p>烈阳站在木屋门口，看着你和另一个人的背影渐渐远去。他的虎尾无力地垂在地上，原本灿烂的笑容早已消失殆尽。</p><p>"呵……我果然还是不如他。"他挠了挠头，声音里带着从未有过的失落。"只要你开心就好。"他勉强扯出一个笑容。</p>`,
        xuanyu: `<h2>🦊 玄羽·爱而不得</h2><p>玄羽倚在幻香居的竹帘旁，看着你逐渐远去的身影，那双总是盛满戏谑的狐狸眼此刻只剩下一片沉寂。九条尾巴静静地垂落，不再优雅地摆动。</p><p>"两百年了，我以为终于找到了归宿。"他轻叹一声，指尖那朵散发幽光的奇花悄然凋零。"愿你此生，有人相伴。"</p>`,

    function addAffectionAndObsession(guy, amount, triggerJealousy = true) {

        // 占有欲>=100 且 没有人交往 且 游戏活跃 -> 触发囚禁

    function triggerMultiGuyConflict(guyList, place) { const names = guyList.map(g => g.name).join('和'); const all100 = guyList.every(g => g.affection >= 100); const desc = all100 ? `${names}看到彼此与你亲近，怒气冲冲，甚至准备大打出手！` : `${names}看到彼此与你亲近，眼神交锋，言语间弥漫着浓浓的火药味。`; let html = `<div class="global-overlay" id="conflictModal"><div class="modal-box"><div style="font-weight:700;color:var(--accent);">⚡ 冲突爆发</div><p>${desc}</p><div class="actions">`; html += all100 ? `<button class="btn" id="ignoreFight">🛑 不管他们</button>` : `<button class="btn" id="ignoreFight">🛑 不插手</button>`; guyList.forEach(g => { html += `<button class="btn" data-id="${g.id}">${all100 ? '🛡️ 护着' : '💬 为'}${g.name}${all100 ? '' : '说话'}</button>`; }); html += `</div></div></div>`; const modal = showGlobalModal(html, 'conflictModal'); modal.querySelector('#ignoreFight').addEventListener('click', () => { modal.remove(); if (all100) { guyList.forEach(g => { g.injured = true; g.injuredDays = 4 + Math.floor(Math.random() * 3); }); addLog(`${guyList.map(g=>g.name).join('和')}打了起来，两人都受伤了！`, place.name); } else addLog(`你没有插手，${guyList.map(g=>g.name).join('和')}不欢而散。`, place.name); checkHealthStatus(); advanceTime(); updateTopBar(); renderPlaces(); }); modal.querySelectorAll('[data-id]').forEach(btn => btn.addEventListener('click', () => { modal.remove(); const favoredId = btn.dataset.id; const favored = guyList.find(g => g.id === favoredId); const other = guyList.find(g => g.id !== favoredId); if (favored) addAffectionAndObsession(favored, 5); if (other) { other.affection = Math.max(0, other.affection - 5); other.sulkingDays = 3 + Math.floor(Math.random() * 2); other.sulkingTarget = favoredId; addLog(`你偏袒了${favored.name}，${other.name}心碎地离开了，暂时不愿见你。`, place.name); unlockAchievement('peacemaker'); checkAchievements(); } checkHealthStatus(); advanceTime(); updateTopBar(); renderPlaces(); })); }

    function showDisasterModal(disaster, loss, caregiverGuy) { let caregiverText = caregiverGuy ? `<p style="color:var(--accent);">💕 你受伤很重，${caregiverGuy.name}听闻后焦急地赶来照顾你，为你处理伤口，你的生命值恢复了15点，好感度也提高了。</p>` : ''; const html = `<div class="global-overlay" id="disasterModal"><div class="modal-box"><div style="font-size:2em;text-align:center;">⚠️</div><b>${disaster.name}</b><p>${disaster.desc}</p><p>生命值减少了 <b>${loss}</b> 点。</p>${caregiverText}<button class="btn" id="closeDisaster" style="width:100%;margin-top:10px;">继续</button></div></div>`; const modal = showGlobalModal(html, 'disasterModal'); modal.querySelector('#closeDisaster').addEventListener('click', () => modal.remove()); }
    function triggerDisaster() { const disasters = [ { name:'暴雨', desc:'突如其来的暴雨淹没了部落低洼处。', dmg:()=>10+Math.floor(Math.random()*15) }, { name:'野兽袭击', desc:'夜间有野兽闯入部落边缘。', dmg:()=>8+Math.floor(Math.random()*18) }, { name:'瘟疫', desc:'部落里出现了轻微的传染病。', dmg:()=>5+Math.floor(Math.random()*20) }, { name:'山火', desc:'远处的山林起火，部落全员扑救。', dmg:()=>15+Math.floor(Math.random()*10) } ]; const disaster = disasters[Math.floor(Math.random()*disasters.length)]; const loss = disaster.dmg(); const p = state.player; p.stats.health = Math.max(1, p.stats.health - loss); addLog(`【天灾】${disaster.name}：${disaster.desc} 生命值减少了${loss}点。`); const criticalThreshold = Math.min(p.maxHealth * 0.4, 50); let caregiverGuy = null; if (p.stats.health <= criticalThreshold && p.stats.endurance < 90 && Math.random() < (p.stats.endurance < 50 ? 0.7 : p.stats.endurance < 70 ? 0.4 : 0.15)) { const tg = getTopGuy(); if (tg && Math.random() < 0.6) { p.stats.health = Math.min(p.maxHealth, p.stats.health + 15); addAffectionAndObsession(tg, 3); addLog(`${tg.name}得知你受伤，急忙赶来照顾你，你的生命恢复了15点。`); caregiverGuy = tg; } } showDisasterModal(disaster, loss, caregiverGuy); checkHealthStatus(); }

    function showCombinedEventModal(eventsList) { const items = eventsList.map(ev => `<div style="margin-bottom:12px;"><b>${ev.name}</b><br>${ev.desc}<br><span style="color:var(--accent);">📍 ${ev.locations.join('、')}</span></div>`).join(''); const html = `<div class="global-overlay" id="combinedEventModal"><div class="modal-box"><div style="font-size:1.8em;text-align:center;">🎊 今日活动</div>${items}<button class="btn" id="closeCombinedEvent" style="width:100%;margin-top:10px;">知道了</button></div></div>`; const modal = showGlobalModal(html, 'combinedEventModal'); modal.querySelector('#closeCombinedEvent').addEventListener('click', () => modal.remove()); }
    function showAutoSaveModal() { const old = document.getElementById('autoSaveModal'); if (old) old.remove(); contentArea.insertAdjacentHTML('beforeend', `<div class="modal-overlay" id="autoSaveModal"><div class="modal-box"><div style="font-size:2em;">💾</div><b>自动存档完成</b><p>游戏进度已保存到自动存档位（存档1）。</p><button class="btn" id="closeAutoSave" style="width:100%;margin-top:10px;">知道了</button></div></div>`); document.getElementById('closeAutoSave').addEventListener('click', () => { document.getElementById('autoSaveModal').remove(); }); }
    function autoSave() { if (state.autoSaveMode === 'never') return; let shouldSave = false; if (state.autoSaveMode === 'day') shouldSave = true; else if (state.autoSaveMode === 'week' && state.player.day % 7 === 0) shouldSave = true; if (shouldSave) { saveToSlot(0); addLog('💾 已自动存档。'); showAutoSaveModal(); } }

    function advanceTime() { state.player.time++; if (state.player.time > 3) { state.player.time = 0; state.player.day++; const currentEvents = getCurrentEvents(); if (currentEvents.length) { showCombinedEventModal(currentEvents); addLog(`今天是${currentEvents.map(e=>e.name).join('、')}活动日。`); } state.player.stats.health = Math.min(state.player.maxHealth, state.player.stats.health + 5); addLog('新的一天，生命恢复了少许。'); if (Math.random() < 0.1) triggerDisaster(); else checkHealthStatus(); autoSave(); } updateTopBar(); }

    function renderSettings() { const tb = Object.entries(themes).map(([k, t]) => `<div class="color-dot${state.currentTheme===k?' active':''}" data-theme="${k}" style="background:${t.primary};" title="${t.name}"></div>`).join(''); const autoModes = ['never', 'day', 'week']; const modeNames = { never:'从不', day:'每1天', week:'每7天' }; const modeBtns = autoModes.map(m => `<button class="btn${state.autoSaveMode===m?' active-btn':''}" id="autoModeBtn_${m}">${modeNames[m]}</button>`).join(''); contentArea.innerHTML = `<div class="card"><b>💾 存档管理</b><br><button class="btn" id="openSaveLoad">📂 存档 / 读档（共5个存档位）</button></div><div class="card"><b>🏆 收藏品</b><br><div style="display:flex;gap:8px;justify-content:center;"><button class="btn" id="openEndingGallery2">📖 结局图鉴</button><button class="btn" id="openAchievementGallery2">🏆 成就查看</button></div></div><div class="card"><b>⚙️ 自动存档</b><br><div style="display:flex;gap:8px;justify-content:center;">${modeBtns}</div><div style="font-size:0.75em;color:var(--text2);margin-top:8px;">自动存档位：存档1（仅可读档）</div></div><div class="card"><b>🎨 UI色调</b><br><div style="display:flex;justify-content:center;flex-wrap:wrap;">${tb}</div></div><div class="card"><button class="btn" id="restartBtn">🔄 重新开始</button></div>`; document.getElementById('openSaveLoad').addEventListener('click', openSaveLoadModal); document.getElementById('openEndingGallery2').addEventListener('click', showEndingGallery); document.getElementById('openAchievementGallery2').addEventListener('click', showAchievementsModal); document.querySelectorAll('.color-dot').forEach(d => d.addEventListener('click', function () { applyTheme(this.dataset.theme); document.querySelectorAll('.color-dot').forEach(dd => dd.classList.remove('active')); this.classList.add('active'); })); document.getElementById('restartBtn').addEventListener('click', restartGame); autoModes.forEach(m => { document.getElementById(`autoModeBtn_${m}`).addEventListener('click', () => { state.autoSaveMode = m; if (m !== 'never') alert(`✅ 已设置为自动存档：${modeNames[m]}`); else alert('自动存档已关闭。'); renderSettings(); }); }); }
    function openSaveLoadModal() { const old = document.getElementById('saveModal'); if (old) old.remove(); const slots = getSaveSlots(); let html = ''; for (let i = 0; i < MAX_SLOTS; i++) { const d = slots[i]; const isAuto = i === 0; html += `<div class="save-slot${isAuto?' auto-slot':''}"><b>存档 ${i+1}${isAuto?' (自动)':''}</b><br><span style="color:var(--text2)">${d?formatSlotInfo(d):'空'}</span><div style="margin-top:5px;display:flex;gap:5px;">${!isAuto?`<button class="btn save-action" data-slot="${i}" style="flex:1;">💾保存</button>`:''}<button class="btn load-action" data-slot="${i}" style="flex:1;">📤读取</button></div></div>`; } contentArea.insertAdjacentHTML('beforeend', `<div class="modal-overlay" id="saveModal"><div class="modal-box"><div style="font-weight:700;color:var(--accent);margin-bottom:10px;">💾 存档 / 读档</div>${html}<button class="btn" id="closeSaveModal" style="width:100%;margin-top:10px;">返回</button></div></div>`); document.getElementById('closeSaveModal').addEventListener('click', () => document.getElementById('saveModal').remove()); document.querySelectorAll('.save-action').forEach(btn => btn.addEventListener('click', function () { saveToSlot(parseInt(this.dataset.slot)); alert(`✅ 已保存到存档 ${parseInt(this.dataset.slot)+1}`); document.getElementById('saveModal').remove(); })); document.querySelectorAll('.load-action').forEach(btn => btn.addEventListener('click', function () { if (loadFromSlot(parseInt(this.dataset.slot))) { alert(`✅ 已从存档 ${parseInt(this.dataset.slot)+1} 读取`); document.getElementById('saveModal').remove(); topBar.style.display = 'flex'; navBar.style.display = 'flex'; state.gameStarted = true; updateTopBar(); renderHome(); } else alert('该存档位为空。'); })); }
    function getUnlockedEndings() { const raw = localStorage.getItem('beastLove_endings'); return raw ? JSON.parse(raw) : []; }
    function unlockEnding(id) { const endings = getUnlockedEndings(); if (!endings.includes(id)) { endings.push(id); localStorage.setItem('beastLove_endings', JSON.stringify(endings)); } }
    function showEndingGallery() { const unlocked = getUnlockedEndings(); let html = '<div class="modal-overlay" id="galleryModal"><div class="modal-box"><h2>📖 结局图鉴</h2><div class="ending-grid">'; ALL_ENDINGS.forEach(e => { const isUnlocked = unlocked.includes(e.id); html += `<div class="ending-item${isUnlocked?'':' locked'}"><div class="ending-icon">${isUnlocked ? e.icon : '❓'}</div><div>${isUnlocked ? e.name : '？？？'}</div><div style="font-size:0.7em;color:var(--text2);">${isUnlocked ? e.desc : '尚未解锁'}</div></div>`; }); html += '</div><button class="btn" id="closeGallery" style="width:100%;margin-top:15px;">返回</button></div></div>'; contentArea.insertAdjacentHTML('beforeend', html); document.getElementById('closeGallery').addEventListener('click', () => { document.getElementById('galleryModal').remove(); }); document.getElementById('galleryModal').addEventListener('click', function(e){ if(e.target===this) this.remove(); }); }
    function showAchievementsModal() { const unlocked = getUnlockedAchievements(); let html = '<div class="modal-overlay" id="achievementModal"><div class="modal-box"><h2>🏆 成就</h2><div class="achievement-grid">'; ACHIEVEMENTS.forEach(a => { const isUnlocked = unlocked.includes(a.id); html += `<div class="achievement-item${isUnlocked?'':' locked'}"><div class="ending-icon">${isUnlocked ? a.icon : '❓'}</div><div>${isUnlocked ? a.name : '？？？'}</div><div style="font-size:0.7em;color:var(--text2);">${isUnlocked ? a.desc : '尚未达成'}</div></div>`; }); HIDDEN_ACHIEVEMENTS.forEach(a => { const isUnlocked = unlocked.includes(a.id); if (isUnlocked) html += `<div class="achievement-item"><div class="ending-icon">${a.icon}</div><div>${a.name}</div><div style="font-size:0.7em;color:var(--text2);">${a.desc}</div></div>`; }); html += '</div><button class="btn" id="closeAchievement" style="width:100%;margin-top:15px;">返回</button></div></div>'; contentArea.insertAdjacentHTML('beforeend', html); document.getElementById('closeAchievement').addEventListener('click', () => { document.getElementById('achievementModal').remove(); }); document.getElementById('achievementModal').addEventListener('click', function(e){ if(e.target===this) this.remove(); }); }

    setInterval(() => { const dynamicPetals = document.querySelectorAll('.dynamic-petal'); if (dynamicPetals.length >= 5) return; const petal = document.createElement('div'); petal.className = 'petal dynamic-petal'; petal.textContent = ['🌸','💮','🌺'][Math.floor(Math.random()*3)]; petal.style.left = Math.random()*100+'%'; petal.style.animationDuration = (8+Math.random()*12)+'s'; document.body.appendChild(petal); setTimeout(() => petal.remove(), 15000); }, 2500);
    document.querySelectorAll('.nav-item').forEach(item => item.addEventListener('click', function () { switchTab(this.dataset.tab); }));

    function renderStartScreen() { const keys = ['health','charm','intuition','endurance','talent','affinity']; const icons = ['❤️','💖','🔮','🛡️','🎨','🤝']; const names = ['生命','魅力','直觉','体质','才艺','亲和']; const sh = keys.map((k, i) => `<div class="stat-mini-item"><span>${icons[i]}</span><div class="stat-mini-value" id="val${k.charAt(0).toUpperCase()+k.slice(1)}">${tempStats[k]}</div><div class="stat-mini-name">${names[i]}</div></div>`).join(''); const ah = avatarList.map((av, i) => `<div class="avatar-option${i===0?' selected':''}" data-avatar="${av.emoji}" title="${av.desc}">${av.emoji}</div>`).join(''); contentArea.innerHTML = `<div class="start-screen"><div class="start-title">兽 世 恋 歌</div><div class="start-subtitle">～ 现代少女 × 毛茸茸兽人 ～</div><div class="input-group"><label>✏️ 你的名字</label><br><input type="text" id="playerNameInput" value="小春" maxlength="10"></div><div style="font-weight:700;color:var(--accent);">👩🏻 选择头像</div><div class="avatar-grid" id="startAvatarGrid">${ah}</div><div class="stats-mini"><div class="stats-mini-title">✨ 初始属性（生命上限可通过锻炼提升至100，其他属性上限100）</div><div class="stats-mini-grid">${sh}</div><button class="random-btn" id="randomStatsBtn">🎲 随机属性</button></div><button class="start-btn" id="enterGameBtn">🌸 踏入兽世 🌸</button><div style="display:flex;gap:10px;"><button class="btn" id="galleryBtn" style="background:#aaa;">📖 结局图鉴</button><button class="btn" id="achievementStartBtn" style="background:#aaa;">🏆 成就</button></div></div>`; document.querySelectorAll('#startAvatarGrid .avatar-option').forEach(opt => opt.addEventListener('click', function () { document.querySelectorAll('#startAvatarGrid .avatar-option').forEach(o => o.classList.remove('selected')); this.classList.add('selected'); selectedAvatar = this.dataset.avatar; })); document.getElementById('randomStatsBtn').addEventListener('click', () => { tempStats.health = Math.floor(Math.random()*21)+80; tempStats.charm = Math.floor(Math.random()*8)+8; tempStats.intuition = Math.floor(Math.random()*9)+6; tempStats.endurance = Math.floor(Math.random()*8)+3; tempStats.talent = Math.floor(Math.random()*8)+5; tempStats.affinity = Math.floor(Math.random()*11)+10; keys.forEach((k, i) => { document.getElementById('val'+k.charAt(0).toUpperCase()+k.slice(1)).textContent = tempStats[k]; }); }); document.getElementById('enterGameBtn').addEventListener('click', () => { state.player.name = document.getElementById('playerNameInput').value.trim() || '小春'; state.player.avatar = selectedAvatar; Object.keys(tempStats).forEach(k => state.player.stats[k] = tempStats[k]); state.player.maxHealth = tempStats.health; showIntroModal(); }); document.getElementById('galleryBtn').addEventListener('click', showEndingGallery); document.getElementById('achievementStartBtn').addEventListener('click', showAchievementsModal); }
    function showIntroModal() { contentArea.innerHTML = `<div class="modal-overlay" id="introModal"><div class="modal-box"><div style="font-size:2.5em;">🌸</div><b style="font-size:1.1em;color:var(--accent);">欢迎来到兽世</b><p>✨ 你——<b>${state.player.name}</b>，一名21世纪的普通大学生。<br>在一次意外中穿越到了兽人统治的原始世界。<br><br>🌿 目前你可前往：<b>部落广场、训练场、铁匠铺、河边、市场</b>。<br>通过反复探索这些地点，你可能会发现通往新地点的线索，或是邂逅神秘的兽人男性……<br><br>⚠️ 生命值低于100时，<b>深夜</b>只能待在家里。<br>生病时<b>全天</b>只能在家休养。<br>部分男主好感高了会自然产生占有欲，请谨慎管理每一段关系。</p><button class="btn" id="closeIntro">🌸 开始冒险</button></div></div>`; document.getElementById('closeIntro').addEventListener('click', () => { document.getElementById('introModal').remove(); state.gameStarted = true; topBar.style.display = 'flex'; navBar.style.display = 'flex'; addLog('你从21世纪穿越到了兽世部落，长老收留了你。'); addLog('💡新手提示：点击底部【地点】标签，选择地点进行探索吧！'); addLog('💡恢复生命：在家休息可恢复5-10点生命，温泉恢复20点，锻炼也能小幅恢复。'); if (state.player.maxHealth < 100) addLog('💡提升生命上限：去训练场锻炼身体有概率提升生命值上限（最高100点）。'); addLog('💡偶遇男主：在训练场、月崖、密林小径等地探索，有机会邂逅他们。'); updateTopBar(); renderHome(); }); }
    loadTheme();
    if (hasAnySave()) { contentArea.innerHTML = `<div class="start-screen" style="gap:15px;"><div class="start-title">兽 世 恋 歌</div><div style="font-size:0.9em;color:var(--text2);">～ 检测到存档记录 ～</div><button class="btn" id="loadLastBtn" style="font-size:1.1em;">📤 继续冒险（最近存档）</button><button class="btn" id="newGameBtn" style="background:#ff4d6d;font-size:1.1em;">🆕 全新开始</button></div>`; document.getElementById('loadLastBtn').addEventListener('click', () => { let loaded = false; for (let i = MAX_SLOTS-1; i >= 0; i--) { if (loadFromSlot(i)) { loaded = true; break; } } if (loaded) { topBar.style.display = 'flex'; navBar.style.display = 'flex'; state.gameStarted = true; updateTopBar(); renderHome(); } else alert('存档损坏，请全新开始。'); }); document.getElementById('newGameBtn').addEventListener('click', () => { restartGame(); }); } else { renderStartScreen(); }
</script>
</body>
