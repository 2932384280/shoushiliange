<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no">
    <title>兽世恋歌 · v1.4.7</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- TapTap H5 广告 SDK -->
    <script src="https://sdk.tapcdn.com/h5/adsdk/1.0.0/tap-ad-sdk.js"></script>
</head>
<body>
<div class="petal" style="left:5%;animation-duration:13s;">🌸</div>
<div class="petal" style="left:30%;animation-duration:16s;">💮</div>
<div class="petal" style="left:55%;animation-duration:10s;">🌺</div>
<div class="petal" style="left:75%;animation-duration:18s;">🌸</div>
<div class="petal" style="left:90%;animation-duration:14s;">💠</div>
<div class="game-app" id="gameApp">
    <!-- 顶部栏 -->
    <div class="top-bar" id="topBar" style="display:none;">
        <div class="top-left">
            <div class="player-info">
                <div class="player-avatar-small" id="headerAvatar">👧🏻</div>
                <div>
                    <div class="player-name-small" id="headerName">小春</div>
                    <div class="header-health">
                        <div class="health-bar-mini"><div class="health-bar-fill" id="healthFill" style="width:100%;"></div></div>
                        <span id="healthText" style="font-size:0.6em;color:var(--text2);">90/90</span>
                    </div>
                </div>
            </div>
            <div class="header-date" id="headerDay">兽历222年 春季 1月1日</div>
        </div>
        <div class="top-center">
            <div class="time-period" id="headerTime">🌅 早晨</div>
            <div class="event-indicator" id="eventIndicator"></div>
        </div>
        <div class="top-right">
            <div class="header-gold" id="headerGold">💰50 (每日需4)</div>
        </div>
    </div>

    <!-- 内容区 -->
    <div class="content-area" id="contentArea"></div>

    <!-- 导航栏 -->
    <div class="nav-bar" id="navBar" style="display:none;">
        <div class="nav-item active" data-tab="home">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">主页</span>
        </div>
        <div class="nav-item" data-tab="guys">
            <span class="nav-icon">❤️</span>
            <span class="nav-label">男主</span>
        </div>
        <div class="nav-item" data-tab="npcs">
            <span class="nav-icon">👥</span>
            <span class="nav-label">角色</span>
        </div>
        <div class="nav-item" data-tab="places">
            <span class="nav-icon">📍</span>
            <span class="nav-label">地点</span>
        </div>
        <div class="nav-item" data-tab="settings">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">设置</span>
        </div>
    </div>
</div>

<!-- 背景音乐 -->
<audio id="bgm" loop preload="auto" style="display:none;"></audio>

<!-- 主脚本（使用 type="module" 静态导入） -->
<script type="module" src="js/main.js?v=20250714"></script>
</body>
</html>
